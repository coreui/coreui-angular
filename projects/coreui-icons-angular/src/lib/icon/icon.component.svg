@if (!use() && !!code() && !isServer) {
  <svg
    xmlns="http://www.w3.org/2000/svg"
    [innerHtml]="innerHtml()"
    [class]="computedClasses()"
    [cHtmlAttr]="svgAttributes()"
    #svgElement
  >
  </svg>
} @else if (use()) {
  <svg xmlns="http://www.w3.org/2000/svg" [class]="computedClasses()" [cHtmlAttr]="svgAttributes()" #svgElement>
    <use [attr.href]="use()"></use>
  </svg>
}
