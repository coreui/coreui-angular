@let grpItem = item();
<a
  (click)="toggleGroup($event)"
  [cHtmlAttr]="$safeNavigationMigration(grpItem?.attributes)"
  class="nav-link nav-group-toggle"
  href
>
  <ng-container *ngTemplateOutlet="iconTemplate; context: { $implicit: grpItem }" />
  <ng-container>{{ grpItem?.name }}</ng-container>
  @if (grpItem?.badge) {
    <span [class]="grpItem | cSidebarNavBadge">{{ grpItem?.badge?.text }}</span>
  }
</a>
<c-sidebar-nav
  (collapseChange)="onCollapseChange($event)"
  [compact]="compact()"
  [dropdownMode]="dropdownMode()"
  [groupItems]="true"
  [navItems]="navItems()"
  [style.display]="display()"
  [visible]="!!open()"
  cCollapse
/>

<ng-template #iconTemplate let-item>
  <!--  <i *ngIf="item?.icon" [class]="item | cSidebarNavIcon"></i>-->
  @if (item?.icon) {
    <span class="nav-icon">
      <span [class]="item.icon ?? ''"></span>
    </span>
  }
  @if (item?.iconComponent) {
    <svg
      [cIcon]="$safeNavigationMigration(item.iconComponent?.content)"
      [customClasses]="item | cSidebarNavIcon"
      [name]="$safeNavigationMigration(item.iconComponent?.name)"
    />
  }
  @if (!item?.icon && !item?.iconComponent) {
    <span [class]="item | cSidebarNavIcon"></span>
  }
</ng-template>
