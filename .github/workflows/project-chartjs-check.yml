name: Project chartjs check

on:
  push:
    branches:
      - main
      - v5.*
  pull_request:
    branches:
      - main
      - v5.*
permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [24.x]
        os: ${{ fromJSON(github.repository == 'coreui/coreui-angular' && '["ubuntu-latest", "windows-latest", "macOS-latest"]' || '["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Project check
        run: |
          npm run build:chartjs:prod
          npm run lint:chartjs
          npm run test:chartjs:prod
        env:
          CI: true
